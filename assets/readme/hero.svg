<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Matrix Windows Commander — SWIR project hero</title>
  <desc id="desc">Dark electric-cyan banner for a safe Windows diagnostics and repair command center.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02050A"/><stop offset=".55" stop-color="#06101A"/><stop offset="1" stop-color="#02050A"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0088FF"/><stop offset=".5" stop-color="#62E5FF"/><stop offset="1" stop-color="#0088FF"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity=".25"/><rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <path d="M0 258C180 218 300 300 470 263S760 218 930 258S1080 286 1200 240" fill="none" stroke="url(#cyan)" stroke-opacity=".25" stroke-width="2"/>
  <g transform="translate(68 70)"><rect width="170" height="150" rx="22" fill="#07111C" stroke="#62E5FF" stroke-width="3"/><rect x="18" y="20" width="134" height="100" rx="10" fill="#02050A" stroke="#0088FF" stroke-width="2"/><path d="M42 51l25 22-25 22M78 96h43" fill="none" stroke="#62E5FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/><circle cx="32" cy="136" r="5" fill="#0088FF"/><circle cx="50" cy="136" r="5" fill="#62E5FF"/><circle cx="68" cy="136" r="5" fill="#0088FF"/></g>
  <text x="280" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#62E5FF">SWIR PROJECT</text>
  <text x="280" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="800" fill="#F4FAFF">MATRIX WINDOWS COMMANDER</text>
  <text x="282" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="500" fill="#B8D2E0">Safe Windows diagnostics and repair command center.</text>
  <text x="282" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" letter-spacing="1.5" fill="#62E5FF">WINDOWS 10/11  •  PYSIDE6  •  PL / EN</text>
</svg>
